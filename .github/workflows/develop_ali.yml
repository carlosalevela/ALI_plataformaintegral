name: Build and deploy Django to Azure Web App - ali

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  BACKEND_PATH: "ali_backend"
  FRONTEND_PATH: "Ali_Front/ali_fronted"
  SPA_STATIC_SUBDIR: "static/app"
  AZURE_WEBAPP_NAME: "ali"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }

    steps:
      - uses: actions/checkout@v4

      # ---------- FRONTEND (Flutter Web) ----------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Disable Flutter analytics (CI)
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter --version
          dart --version

      # Alinear deps del front para Flutter 3.24.x
      - name: Align pub deps for CI (intl & font_awesome_flutter)
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          flutter pub add intl:0.19.0
          flutter pub add font_awesome_flutter:10.8.0

      - name: Build Flutter Web
        working-directory: ${{ env.FRONTEND_PATH }}
        run: |
          flutter pub get
          flutter build web --release

      - name: Move web build into backend static
        run: |
          mkdir -p "${{ env.BACKEND_PATH }}/${{ env.SPA_STATIC_SUBDIR }}"
          rm -rf "${{ env.BACKEND_PATH }}/${{ env.SPA_STATIC_SUBDIR }}/*" || true
          rsync -a "${{ env.FRONTEND_PATH }}/build/web/" "${{ env.BACKEND_PATH }}/${{ env.SPA_STATIC_SUBDIR }}/"
          # Ajustar base href SOLO en el artefacto generado (no toca tu repo)
          sed -i 's|<base href="/">|<base href="/static/app/">|' "${{ env.BACKEND_PATH }}/${{ env.SPA_STATIC_SUBDIR }}/index.html"

      # ---------- BACKEND ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv & install deps (local check)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r "${{ env.BACKEND_PATH }}/requirements.txt"
          (cd ${{ env.BACKEND_PATH }} && python manage.py collectstatic --noinput) || true

      - name: Upload artifact (only backend folder)
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            ${{ env.BACKEND_PATH }}/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: ./

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_17F25BAE896C4A5D9BCC9834F71E829C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A1B87C4F6C7474BA449EF8A6D58B4FC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0B93AA40981D49F480315F802EFE2BBB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: "Production"
          package: "./ali_backend"

