name: Build and deploy Django to Azure Web App - ali

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  BACKEND_PATH: "ali_backend"    # carpeta donde están manage.py y settings.py
  AZURE_WEBAPP_NAME: "ali"       # nombre del App Service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Instalar dependencias para detectar errores temprano (build local opcional)
      - name: Create venv & install deps (local check)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r ${{ env.BACKEND_PATH }}/requirements.txt
          # Compilar estáticos si usas WhiteNoise (no falla si no hay):
          (cd ${{ env.BACKEND_PATH }} && python manage.py collectstatic --noinput) || true

      # Subir SOLO el backend como artefacto
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            ${{ env.BACKEND_PATH }}/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend
          path: ./

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_17F25BAE896C4A5D9BCC9834F71E829C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A1B87C4F6C7474BA449EF8A6D58B4FC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0B93AA40981D49F480315F802EFE2BBB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: "Production"
          package: "."    # desplegamos el contenido del artefacto (que es ali_backend/)
